# SPDX-License-Identifier: Apache-2.0 OR MIT

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jspassgen"
# The single source of truth for the version: the package reads it back
# with importlib.metadata, and scripts/verify-release-versions checks
# every restatement against this line.
version = "0.0.22"
description = "Native Python port of the jspassgen password and passphrase core, on the secrets module (in development)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Sebastien Rousseau" }]
keywords = ["password", "passphrase", "generator", "csprng", "secrets", "jspassgen"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://jspassgen.com"
Repository = "https://github.com/sebastienrousseau/jspassgen-sdk-python"
Documentation = "https://github.com/sebastienrousseau/jspassgen-sdk-python#readme"
Issues = "https://github.com/sebastienrousseau/jspassgen-sdk-python/issues"
Changelog = "https://github.com/sebastienrousseau/jspassgen-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.18",
  "pytest>=8.4",
  "coverage[toml]>=7.10",
  "hypothesis>=6.140",
  "radon>=6.0.1",
  "complexipy>=4.0",
  "pip-audit>=2.9",
  "build>=1.3",
  "twine>=6.2",
]
# Atheris, the coverage-guided fuzzer behind `make fuzz`. It ships
# wheels only for Linux x86-64 on CPython 3.12 to 3.14, and building it
# needs clang's libFuzzer, so it installs nowhere else; the unit tests
# replay the same contract (tests/test_fuzz.py) on every platform.
fuzz = [
  "atheris>=3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.12' and python_version < '3.15'",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7",
  # 11.0.0 and below carry GHSA-gm37-52c6-37mw and GHSA-9xwg-3r6f-jcx2.
  "pymdown-extensions>=11.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jspassgen"]

[tool.hatch.build.targets.sdist]
include = [
  "src/jspassgen",
  "tests",
  "fuzz",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C90", "S", "SIM", "RUF", "PL", "N", "PT"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts", "fuzz"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["radon.*", "complexipy", "atheris"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["jspassgen"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
