# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The manual, built from docs/ by `make docs` (MkDocs Material, strict).

site_name: jspassgen for Python
site_description: A native Python port of the jspassgen password and passphrase core.
site_url: https://sebastienrousseau.github.io/jspassgen-sdk-python/
copyright: '&copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>'
repo_url: https://github.com/sebastienrousseau/jspassgen-sdk-python
repo_name: sebastienrousseau/jspassgen-sdk-python
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Policies: POLICIES.md
  - Roadmap: ROADMAP.md
  - Releases:
      - 0.0.23: releases/0.0.23.md
      - 0.0.22: releases/0.0.22.md
  - Project:
      - README: https://github.com/sebastienrousseau/jspassgen-sdk-python/blob/main/README.md
      - Development: https://github.com/sebastienrousseau/jspassgen-sdk-python/blob/main/DEVELOPMENT.md
      - Contributing: https://github.com/sebastienrousseau/jspassgen-sdk-python/blob/main/CONTRIBUTING.md
      - Changelog: https://github.com/sebastienrousseau/jspassgen-sdk-python/blob/main/CHANGELOG.md
      - Security: https://github.com/sebastienrousseau/jspassgen-sdk-python/blob/main/SECURITY.md
