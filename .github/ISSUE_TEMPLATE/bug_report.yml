# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Bug Report
description: Report a reproducible problem in jspassgen-sdk-python
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Never paste a real password or secret. Report
        security problems privately, as SECURITY.md describes.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "0.0.23"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Python version and platform
      placeholder: "CPython 3.13.1, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducible Example
      render: python
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Error Output
      description: The exception type and message, or the traceback.
    validations:
      required: true
